<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Row Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* v3: dünyalar (kart arkası = ipucu), önizleme yok, açılan kart açık kalır,
   sıradaki sıra açık, hamle hakkı + zincir hamle iadesi, devam teklifi. */
:root{
  color-scheme: dark;
  --night:#14123a; --night-2:#1f1b55;
  --cream:#fbf3e2; --brass:#e7b75a;
  --ink:#2a2140; --fg:#f4eefc; --muted:#a9a0d0;
  --good:#7ee0a1; --bad:#ff6b7a;
  --font-display:"Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body:"Nunito", system-ui, -apple-system, sans-serif;
  --t-move:380ms;
}
@media (prefers-reduced-motion: reduce){ :root{ --t-move:120ms } }
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--night); color:var(--fg); font-family:var(--font-body);
  background-image:radial-gradient(120% 70% at 50% 40%, var(--night-2) 0%, var(--night) 70%);
  overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none;
}
.app{height:100%; display:flex; flex-direction:column; padding-inline:16px; box-sizing:border-box; max-width:560px; margin:0 auto}
header{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:14px 6px}
.pill{display:flex; align-items:center; gap:6px; background:var(--night-2); border:1px solid #ffffff1a; border-radius:999px; padding:6px 14px; font-weight:800; font-variant-numeric:tabular-nums}
.pill small{font-weight:600; color:var(--muted); font-size:12px; letter-spacing:.04em; text-transform:uppercase}
.pill.moves{font-size:20px; padding:6px 16px}
.pill.moves.low{border-color:var(--bad); color:var(--bad); animation:throb 900ms ease-in-out infinite}
.pill.bump{animation:bump 400ms ease}
@keyframes throb{50%{transform:scale(1.07)}}
@keyframes bump{40%{transform:scale(1.25); color:var(--good)}}
.lvlbox{text-align:center}
.lvl{font-family:var(--font-display); font-weight:800; font-size:28px; letter-spacing:.02em; line-height:1}
.tag{display:inline-block; margin-top:3px; font:800 10px/1 var(--font-body); letter-spacing:.12em; padding:4px 8px; border-radius:999px}
.tag.hard{background:#ff9f43; color:#3a1d00}
.tag.super{background:var(--bad); color:#3a0008}
.sub{color:var(--muted); font-size:13px; text-align:center; padding-bottom:6px; min-height:2.6em; text-wrap:balance}
main{flex:1; min-height:0; display:flex; align-items:flex-start; justify-content:center; position:relative}
.board{position:relative; margin-top:22px}
.tray{position:absolute; left:-10px; right:-10px; border-radius:18px; pointer-events:none}
.tray.active{top:-10px; background:linear-gradient(#ffffff14,#ffffff05); border:2px solid var(--brass); box-shadow:0 0 0 4px #e7b75a22, 0 0 30px #e7b75a33 inset}
.tray.next{border:2px dashed #ffffff40}
.tray-label{position:absolute; top:-11px; left:50%; transform:translateX(-50%); font:800 10px/1 var(--font-body); letter-spacing:.12em; padding:5px 10px; border-radius:999px; white-space:nowrap}
.tray.active .tray-label{background:var(--brass); color:var(--ink)}
.tray.next .tray-label{top:auto; bottom:-11px; background:var(--night-2); color:var(--muted); border:1px solid #ffffff30}

.card{position:absolute; left:0; top:0; width:var(--cw); height:var(--ch); transition:transform var(--t-move) cubic-bezier(.25,.9,.3,1.1), opacity 250ms; cursor:pointer; outline:none; z-index:1}
.board.noanim .card, .board.noanim .inner{transition:none !important}
.lift{width:100%; height:100%; transition:transform 160ms ease; perspective:700px}
.inner{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform var(--t-move) ease}
.card.open .inner{transform:rotateY(180deg)}
.face{position:absolute; inset:0; border-radius:14px; border:3px solid #2a2140 !important; backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:0 4px 0 #0000004d, 0 8px 18px #00000040; overflow:hidden}
.front{transform:rotateY(180deg); background:var(--cream); display:grid; place-items:center; box-sizing:border-box}
.front::before{content:""; position:absolute; inset:3px; border-radius:9px; border:3px solid var(--wc)}
.front::after{content:""; position:absolute; left:8%; top:6%; width:30%; height:10%; border-radius:999px; background:#ffffffaa}
.halo{width:92%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle, var(--wl) 0%, transparent 70%)}
.sprite{width:calc(var(--cw) * .8); height:calc(var(--cw) * .8); display:block; filter:drop-shadow(0 3px 0 #2a214033); overflow:visible}
.sprite.pop-in{animation:wobble 500ms ease}
@keyframes wobble{30%{transform:scale(1.15) rotate(-6deg)} 60%{transform:scale(.95) rotate(4deg)}}
.back{box-sizing:border-box; box-shadow:inset 0 0 0 3px var(--cream), 0 4px 0 #0000004d !important}
.wname{position:absolute; left:50%; bottom:6%; transform:translateX(-50%); font:800 max(9px, calc(var(--cw)*.13))/1 var(--font-body); letter-spacing:.02em;
  background:#00000055; color:#fff; padding:3px 4px; max-width:92%; box-sizing:border-box; border-radius:999px; white-space:nowrap}

/* Dünya arka yüzleri: manzara, hiçbir kart sembolü içermez */
.w-space{background:
  radial-gradient(1.6px 1.6px at 20% 25%, #fff 60%, transparent 70%),
  radial-gradient(1.2px 1.2px at 70% 15%, #fff 60%, transparent 70%),
  radial-gradient(2px 2px at 55% 55%, #ffe9a8 60%, transparent 70%),
  radial-gradient(1.2px 1.2px at 30% 70%, #fff 60%, transparent 70%),
  radial-gradient(1.6px 1.6px at 80% 75%, #fff 60%, transparent 70%),
  radial-gradient(1px 1px at 12% 50%, #fff 60%, transparent 70%),
  radial-gradient(1px 1px at 88% 40%, #fff 60%, transparent 70%),
  linear-gradient(170deg, #2a2f8a, #0b0d33)}
.w-sea{background:
  radial-gradient(circle at 30% 30%, #ffffff66 0 3px, transparent 4px),
  radial-gradient(circle at 70% 48%, #ffffff55 0 2px, transparent 3px),
  radial-gradient(circle at 50% 0, transparent 8px, #ffffff70 9px 11px, transparent 12px) 0 60% / 22px 14px repeat-x,
  radial-gradient(circle at 50% 0, transparent 8px, #ffffff45 9px 11px, transparent 12px) 11px 80% / 22px 14px repeat-x,
  linear-gradient(#36c6d8, #0d7c9a)}
.w-nature{background:
  radial-gradient(circle at 70% 25%, #e6fff2 0 2.5px, transparent 3.5px),
  repeating-linear-gradient(100deg, transparent 0 5px, #ffffff1c 5px 7px),
  linear-gradient(#6fd06a, #2f8a33)}
.w-sky{background:
  radial-gradient(ellipse 30% 14% at 30% 30%, #fff 95%, transparent),
  radial-gradient(ellipse 20% 12% at 45% 26%, #fff 95%, transparent),
  radial-gradient(ellipse 32% 13% at 68% 62%, #fffffff0 95%, transparent),
  radial-gradient(ellipse 18% 11% at 58% 58%, #fffffff0 95%, transparent),
  linear-gradient(#8fd3ff, #4aa6ea)}
.w-party{background:
  radial-gradient(circle at 20% 20%, #ffd23f 0 3px, transparent 4px),
  radial-gradient(circle at 75% 30%, #3ee0c8 0 3px, transparent 4px),
  radial-gradient(circle at 40% 60%, #ff6fa8 0 3px, transparent 4px),
  radial-gradient(circle at 80% 70%, #ffd23f 0 2.5px, transparent 3.5px),
  radial-gradient(circle at 25% 80%, #3ee0c8 0 2.5px, transparent 3.5px),
  radial-gradient(circle at 60% 15%, #ff6fa8 0 2px, transparent 3px),
  linear-gradient(160deg, #9a4fd6, #5b2a86)}

.card.sel .lift{transform:translateY(-8px) scale(1.05)}
.card.sel .face{box-shadow:0 0 0 3px var(--good), 0 0 22px #7ee0a188, 0 10px 20px #0006}
.card:focus-visible .face{box-shadow:0 0 0 3px var(--brass)}
.card.pop .lift{transform:scale(1.1)}
.card.pop .face{box-shadow:0 0 0 3px var(--brass), 0 0 30px var(--brass)}
.card.gone{opacity:0}
.card.gone .lift{transform:scale(.2) rotate(12deg)}
.card.reveal .lift{animation:reveal 500ms ease}
@keyframes reveal{40%{transform:scale(1.12)}}

.card.indeck{opacity:0; pointer-events:none}
.deck{position:absolute; left:0; right:0; pointer-events:none}
.deck i{position:absolute; left:calc(var(--k) * 6px); right:calc(var(--k) * 6px); top:calc(var(--k) * -6px); height:100%; border-radius:12px; border:3px solid #2a2140;
  box-shadow:inset 0 0 0 3px var(--cream), 0 4px 0 #0000004d; z-index:calc(3 - var(--k));
  background:radial-gradient(circle at 50% 50%, var(--brass) 0 6px, transparent 7px), repeating-linear-gradient(45deg, #ffffff12 0 6px, transparent 6px 12px), linear-gradient(160deg, #7a3fb0, #5b2a86)}
.deck b{position:absolute; left:50%; bottom:-14px; transform:translateX(-50%); z-index:5; background:var(--brass); color:var(--ink); font:800 11px/1 var(--font-body); letter-spacing:.06em; padding:5px 10px; border-radius:999px; white-space:nowrap}
.spark{position:absolute; width:10px; height:10px; border-radius:3px; pointer-events:none; animation:spark 700ms ease-out forwards; z-index:20}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(.3); opacity:0}}
.float{position:absolute; pointer-events:none; font:800 28px var(--font-display); color:var(--brass); text-shadow:0 2px 0 #0006; animation:floatUp 1000ms ease-out forwards; white-space:nowrap; transform:translate(-50%,-50%); z-index:21}
.float.gain{color:var(--good); font-size:22px}
@keyframes floatUp{from{opacity:0; margin-top:10px} 20%{opacity:1} to{opacity:0; margin-top:-55px}}
.shake{animation:shake 300ms ease}
@keyframes shake{25%{translate:-4px 2px} 50%{translate:4px -2px} 75%{translate:-2px 1px}}

footer{display:flex; gap:10px; justify-content:center; padding-block:12px 18px}
button{font:800 15px var(--font-body); color:var(--ink); background:var(--cream); border:0; border-radius:14px; padding:12px 18px; box-shadow:0 4px 0 #b99b6a; cursor:pointer}
button:active{transform:translateY(2px); box-shadow:0 2px 0 #b99b6a}
button.primary{background:var(--brass); box-shadow:0 4px 0 #a87a2a}
button.ghost{background:transparent; color:var(--fg); box-shadow:none; border:1px solid #ffffff30}
button:focus-visible{outline:3px solid var(--good); outline-offset:2px}

.overlay{position:fixed; inset:0; background:#0b0a24cc; display:grid; place-items:center; padding:16px; z-index:50}
.panel{background:var(--night-2); border:2px solid var(--brass); border-radius:22px; padding:24px 28px; text-align:center; max-width:320px; width:100%; box-sizing:border-box; animation:popIn 300ms cubic-bezier(.2,1.4,.4,1); display:flex; flex-direction:column; gap:10px}
.panel.fail{border-color:var(--bad)}
@keyframes popIn{from{transform:scale(.8); opacity:0}}
.panel h2{font:800 32px/1.1 var(--font-display); margin:0}
.stars{font-size:40px; letter-spacing:6px}
.stars .off{opacity:.2; filter:grayscale(1)}
.panel p{color:var(--muted); margin:0 0 6px}
.panel .big{font:800 20px var(--font-display); color:var(--fg)}
</style>

<div class="app">
  <header>
    <div class="pill moves" id="movesPill"><small>Hamle</small><span id="moves">0</span></div>
    <div class="lvlbox"><div class="lvl" id="lvl">LV.1</div><span class="tag" id="tag" hidden></span></div>
    <div class="pill" id="coinPill">🪙 <span id="coins">0</span></div>
  </header>
  <div class="sub" id="sub"></div>
  <main id="main"><div class="board" id="board"></div></main>
  <footer>
    <button id="restartBtn" type="button">↻ Yeniden</button>
    <button id="soundBtn" type="button" class="ghost" aria-label="Ses">🔊</button>
  </footer>
</div>

<div class="overlay" id="winOverlay" hidden>
  <div class="panel">
    <h2 id="winTitle">Seviye tamam!</h2>
    <div class="stars" id="stars"></div>
    <p class="big" id="winCoins"></p>
    <p id="winText"></p>
    <button class="primary" id="nextBtn" type="button">Sonraki seviye</button>
  </div>
</div>
<div class="overlay" id="failOverlay" hidden>
  <div class="panel fail">
    <h2>Hamle bitti!</h2>
    <p class="big" id="failText"></p>
    <p id="failSub"></p>
    <button class="primary" id="contBtn" type="button">+5 hamle ile devam</button>
    <button id="retryBtn" type="button">Tekrar dene</button>
  </div>
</div>

<script>
// Dünyalar: arka yüz = dünya (ipucu), ön yüz = o dünyadan bir nesne.
const WORLDS = [
  {k:'space',  name:'UZAY',    c:'#3b3fb0', l:'#b9bcff'},
  {k:'sea',    name:'DENİZ',   c:'#1597b0', l:'#9fe8f2'},
  {k:'nature', name:'DOĞA',    c:'#3c9a3a', l:'#bff0a8'},
  {k:'sky',    name:'GÖKYÜZÜ', c:'#3d95db', l:'#cfeaff'},
  {k:'party',  name:'PARTİ',   c:'#8a45c4', l:'#f0c8ff'},
];
const ITEMS = [
  {w:0, e:'🚀'}, {w:0, e:'🪐'}, {w:0, e:'🌙'},
  {w:1, e:'🦀'}, {w:1, e:'🐠'}, {w:1, e:'🐚'},
  {w:2, e:'🌻'}, {w:2, e:'🍄'}, {w:2, e:'🌵'},
  {w:3, e:'☀️'}, {w:3, e:'🌈'}, {w:3, e:'❄️'},
  {w:4, e:'🎂'}, {w:4, e:'🎁'}, {w:4, e:'🎈'},
];
// Testere dişi eğri. s = aynı dünyayı paylaşan ek tür sayısı (çıkarım zorluğu),
// slack = tahmini çözüm hamlesine eklenen pay (ana zorluk ayarı). d: 0 normal, 1 zor, 2 çok zor.
const LEVELS = [
  {c:3,r:3,s:0,slack:6,d:0}, {c:3,r:3,s:0,slack:5,d:0}, {c:3,r:4,s:0,slack:5,d:0}, {c:4,r:4,s:0,slack:5,d:0},
  {c:4,r:4,s:1,slack:4,d:0}, {c:3,r:5,s:0,slack:4,d:0}, {c:4,r:5,s:0,slack:3,d:0}, {c:4,r:5,s:1,slack:3,d:0},
  {c:4,r:5,s:0,slack:4,d:0}, {c:4,r:6,s:2,slack:3,d:0}, {c:3,r:5,s:0,slack:5,d:0}, {c:4,r:6,s:2,slack:1,d:1},
  {c:4,r:5,s:1,slack:4,d:0}, {c:5,r:5,s:1,slack:3,d:0}, {c:5,r:5,s:2,slack:1,d:1}, {c:4,r:7,s:2,slack:5,d:0,v:5},
  {c:4,r:7,s:2,slack:4,d:0,v:5}, {c:4,r:8,s:3,slack:4,d:0,v:5}, {c:5,r:7,s:3,slack:1,d:2,v:5}, {c:5,r:8,s:3,slack:4,d:0,v:5},
];

// --- Toon sprite'lar: kalın koyu kontur, düz parlak renk, beyaz parlama ---
const O = '#2a2140';
const hl = (x, y, rx, ry, r = -20) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${r} ${x} ${y})" fill="#fff" opacity=".75" stroke="none"/>`;
const eyes = (x1, x2, y, r = 3) => `<circle cx="${x1}" cy="${y}" r="${r}" fill="${O}" stroke="none"/><circle cx="${x2}" cy="${y}" r="${r}" fill="${O}" stroke="none"/>`;
const cheeks = (x1, x2, y) => `<ellipse cx="${x1}" cy="${y}" rx="4" ry="2.5" fill="#ff7aa8" opacity=".7" stroke="none"/><ellipse cx="${x2}" cy="${y}" rx="4" ry="2.5" fill="#ff7aa8" opacity=".7" stroke="none"/>`;
const ring = (n, cx, cy, fn) => Array.from({length:n}, (_, i) => fn(i * 360 / n, cx, cy)).join('');
// Kalın renkli çizgi + kontur (iki geçiş)
const duo = (d, col, w = 6) => `<path d="${d}" fill="none" stroke="${O}" stroke-width="${w + 6}"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
// Bulut: önce kalın kontur, sonra dolgu (iç çizgiler görünmez)
const cloud = cs => cs.map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${O}" stroke="${O}" stroke-width="10"/>`).join('') + cs.map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="none"/>`).join('');

const SPRITES = [
  // UZAY: roket, gezegen, ay
  `<path d="M42 74 Q50 99 58 74 Z" fill="#ffb02e"/><path d="M46 74 Q50 88 54 74 Z" fill="#fff36b" stroke="none"/>
   <path d="M36 56 L20 78 L40 72 Z" fill="#ff4d5e"/><path d="M64 56 L80 78 L60 72 Z" fill="#ff4d5e"/>
   <path d="M50 6 C70 22 72 50 64 76 L36 76 C28 50 30 22 50 6 Z" fill="#f4f1ff"/>
   <path d="M50 6 C59 13 64 21 66 28 L34 28 C36 21 41 13 50 6 Z" fill="#ff4d5e"/>
   <circle cx="50" cy="46" r="10" fill="#5ec8ff"/>${hl(46,42,3,5)}${hl(40,52,2.5,10,-5)}`,
  `<g transform="rotate(-18 50 52)"><ellipse cx="50" cy="52" rx="44" ry="13" fill="none" stroke="${O}" stroke-width="12"/><ellipse cx="50" cy="52" rx="44" ry="13" fill="none" stroke="#ffd23f" stroke-width="5"/></g>
   <circle cx="50" cy="52" r="25" fill="#ff8c42"/><path d="M28 44 Q50 50 73 42" fill="none" stroke="#ffb27a" stroke-width="6"/><path d="M27 60 Q50 66 74 58" fill="none" stroke="#d9612a" stroke-width="5"/>
   <circle cx="50" cy="52" r="25" fill="none"/>${hl(40,40,4,7)}
   <g transform="rotate(-18 50 52)"><path d="M6 52 A44 13 0 0 0 94 52" fill="none" stroke="${O}" stroke-width="12"/><path d="M6 52 A44 13 0 0 0 94 52" fill="none" stroke="#ffd23f" stroke-width="5"/></g>`,
  `<path d="M67 17 A38 38 0 1 0 85 66 A32 32 0 0 1 67 17 Z" fill="#ffd84d"/>
   <path d="M26 50 Q31 55 36 50" fill="none" stroke-width="4"/><ellipse cx="26" cy="60" rx="4" ry="2.5" fill="#ff7aa8" opacity=".7" stroke="none"/>
   <path d="M32 66 Q37 70 42 66" fill="none" stroke-width="4"/>${hl(28,32,4,9,25)}`,
  // DENİZ: yengeç, balık, deniz kabuğu
  `<path d="M28 64 L14 72 M30 70 L18 84 M72 64 L86 72 M70 70 L82 84 M34 52 L22 40 M66 52 L78 40" fill="none" stroke-width="6"/>
   <path d="M8 34 A12 12 0 1 1 26 44 L18 34 Z" fill="#ff5a4e"/><path d="M92 34 A12 12 0 1 0 74 44 L82 34 Z" fill="#ff5a4e"/>
   <path d="M42 44 L40 26 M58 44 L60 26" fill="none" stroke-width="5"/>
   <ellipse cx="50" cy="60" rx="28" ry="19" fill="#ff5a4e"/>
   <circle cx="40" cy="24" r="7" fill="#fff"/><circle cx="60" cy="24" r="7" fill="#fff"/>${eyes(41,61,25,3)}
   <path d="M43 64 Q50 70 57 64" fill="none" stroke-width="4"/>${hl(38,52,6,3,-15)}`,
  `<path d="M38 32 Q50 12 64 32 Z" fill="#ff9f1c"/><path d="M70 50 L94 32 L88 50 L94 68 Z" fill="#ff9f1c"/>
   <ellipse cx="46" cy="50" rx="31" ry="22" fill="#ff9f1c"/>
   <path d="M44 30 Q36 50 44 71 L54 70 Q46 50 54 31 Z" fill="#fff" stroke-width="3.5"/>
   <circle cx="27" cy="46" r="7" fill="#fff"/><circle cx="26" cy="46" r="3.5" fill="${O}" stroke="none"/>
   <path d="M16 56 Q20 59 24 56" fill="none" stroke-width="3.5"/>${hl(62,40,6,3,-10)}`,
  `<rect x="38" y="76" width="24" height="12" rx="4" fill="#ff9fb5"/>
   <path d="M50 84 L16 46 Q18 14 50 12 Q82 14 84 46 Z" fill="#ffc2d1"/>
   <path d="M50 82 L28 20 M50 82 L42 13 M50 82 L58 13 M50 82 L72 20" fill="none" stroke-width="3.5"/>${hl(34,30,3,8,-25)}`,
  // DOĞA: ayçiçeği, mantar, kaktüs
  `<path d="M46 60 H54 V96 H46 Z" fill="#4cc35b"/><path d="M52 80 Q70 66 80 76 Q68 90 52 84 Z" fill="#4cc35b"/>
   ${ring(10, 50, 38, (a, cx, cy) => `<ellipse cx="${cx}" cy="${cy-23}" rx="8" ry="13" transform="rotate(${a} ${cx} ${cy})" fill="#ffd23f"/>`)}
   <circle cx="50" cy="38" r="15" fill="#8a5a2b"/>${eyes(44,56,36,2.8)}<path d="M44 43 Q50 48 56 43" fill="none" stroke-width="3.5"/>`,
  `<path d="M36 56 Q33 86 42 88 L58 88 Q67 86 64 56 Z" fill="#fff1d6"/>${eyes(44,56,70,3)}<path d="M46 77 Q50 80 54 77" fill="none" stroke-width="3.5"/>
   <path d="M8 60 Q10 12 50 10 Q90 12 92 60 Q50 70 8 60 Z" fill="#ff4d5e"/>
   <circle cx="32" cy="36" r="7" fill="#fff" stroke="none"/><circle cx="60" cy="26" r="8" fill="#fff" stroke="none"/><circle cx="76" cy="48" r="5.5" fill="#fff" stroke="none"/><circle cx="48" cy="52" r="4" fill="#fff" stroke="none"/>`,
  `<path d="M40 56 H28 Q20 56 20 48 V32 Q20 25 27 25 Q34 25 34 32 V44 H40 Z" fill="#4cc35b"/>
   <path d="M60 48 H68 V24 Q68 17 75 17 Q82 17 82 24 V50 Q82 58 74 58 H60 Z" fill="#4cc35b"/>
   <rect x="36" y="12" width="28" height="66" rx="14" fill="#4cc35b"/>
   <path d="M30 76 H70 L64 96 H36 Z" fill="#e2704a"/><rect x="26" y="70" width="48" height="10" rx="4" fill="#f08a5d"/>
   ${eyes(44,56,34,3)}<path d="M45 42 Q50 46 55 42" fill="none" stroke-width="3.5"/>${cheeks(40,60,40)}${hl(42,22,2.5,6,0)}`,
  // GÖKYÜZÜ: güneş, gökkuşağı, kar tanesi
  `${ring(8, 50, 50, (a, cx, cy) => `<path d="M${cx-8} ${cy-28} L${cx} ${cy-46} L${cx+8} ${cy-28} Z" transform="rotate(${a} ${cx} ${cy})" fill="#ffb703"/>`)}
   <circle cx="50" cy="50" r="26" fill="#ffd23f"/>${eyes(41,59,46,3.5)}<path d="M40 56 Q50 65 60 56" fill="none" stroke-width="4"/>${cheeks(34,66,55)}${hl(38,36,5,3,-30)}`,
  `<path d="M8 72 A42 42 0 0 1 92 72" fill="none" stroke="${O}" stroke-width="38"/>
   ${[[41,'#ff4d5e'],[33,'#ffd23f'],[25,'#4cc35b'],[17,'#4aa6ea']].map(([r,c]) => `<path d="M${50-r} 72 A${r} ${r} 0 0 1 ${50+r} 72" fill="none" stroke="${c}" stroke-width="8.5" stroke-linecap="butt"/>`).join('')}
   ${cloud([[10,74,9],[20,70,11],[28,78,8],[14,82,7]])}${cloud([[90,74,9],[80,70,11],[72,78,8],[86,82,7]])}`,
  `${duo('M50 10 V90 M15 30 L85 70 M15 70 L85 30 M50 10 M40 16 L50 26 L60 16 M40 84 L50 74 L60 84 M18 42 L28 36 L24 24 M82 58 L72 64 L76 76 M18 58 L28 64 L24 76 M82 42 L72 36 L76 24', '#8fd8ff', 6)}
   <circle cx="50" cy="50" r="9" fill="#dff4ff"/>`,
  // PARTİ: pasta, hediye, balon
  `<ellipse cx="50" cy="88" rx="40" ry="7" fill="#e6e0ff"/>
   <rect x="16" y="56" width="68" height="30" rx="7" fill="#a0623a"/>
   <path d="M16 63 Q16 56 23 56 H77 Q84 56 84 63 Q78 70 72 63 Q66 71 60 63 Q54 71 48 63 Q42 71 36 63 Q30 71 24 63 Q20 68 16 63 Z" fill="#fff6e8"/>
   <rect x="28" y="34" width="44" height="24" rx="7" fill="#ff9ec7"/>
   <rect x="46" y="16" width="8" height="18" rx="2" fill="#6ec6ff"/><path d="M50 2 Q58 11 50 16 Q42 11 50 2 Z" fill="#ffb02e"/>${hl(36,42,5,2.5,0)}`,
  `<ellipse cx="38" cy="26" rx="13" ry="8" transform="rotate(20 38 26)" fill="#ffd23f"/><ellipse cx="62" cy="26" rx="13" ry="8" transform="rotate(-20 62 26)" fill="#ffd23f"/>
   <rect x="18" y="44" width="64" height="46" rx="5" fill="#5b8cff"/><rect x="14" y="32" width="72" height="16" rx="5" fill="#7aa2ff"/>
   <rect x="44" y="32" width="12" height="58" fill="#ffd23f"/><circle cx="50" cy="30" r="7" fill="#ffd23f"/>${hl(26,58,3,8,0)}`,
  `<path d="M50 74 Q42 84 52 98" fill="none" stroke-width="3.5"/><path d="M44 76 L56 76 L50 68 Z" fill="#ff5fa2"/>
   <ellipse cx="50" cy="40" rx="27" ry="33" fill="#ff5fa2"/>${hl(39,26,5,10,-20)}${hl(36,42,2.5,3,0)}`,
];
const sprite = t => `<svg class="sprite" viewBox="0 0 100 100" aria-hidden="true"><g stroke="${O}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">${SPRITES[t]}</g></svg>`;
const GAP = 10;
const $ = id => document.getElementById(id);
const board = $('board'), main = $('main');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = reduced ? 120 : 380;
const wait = ms => new Promise(r => setTimeout(r, ms));
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p) }catch(e){} };

let S = null, cw = 60, ch = 78, nextId = 0;
const store = {
  get(k, d){ try{ const v = localStorage.getItem('crs3-'+k); return v === null ? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem('crs3-'+k, JSON.stringify(v)) }catch(e){} },
};
let coins = store.get('coins', 0), soundOn = store.get('sound', true);

// --- kart sesleri: gürültüden sentezlenen kâğıt/kart sesleri (müzik notası yok) ---
let ac = null, noise = null;
function audio(){
  if (!soundOn) return null;
  try{
    if (!ac){
      ac = new (window.AudioContext || window.webkitAudioContext)();
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }catch(e){ return null }
}
// Tek bir kart dokunuşu: kısa, filtrelenmiş gürültü patlaması.
function tick(at = 0, freq = 2600, dur = .03, vol = .35, type = 'bandpass', freqEnd = 0){
  const A = audio(); if (!A) return;
  const t = A.currentTime + at;
  const src = A.createBufferSource(); src.buffer = noise;
  const f = A.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = 1.2;
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  const g = A.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .004);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f).connect(g).connect(A.destination);
  src.start(t, Math.random()*.5); src.stop(t + dur + .02);
}
const sfx = {
  pick(){ tick(0, 3200, .025, .25) },                                       // kartı kaldırma
  swap(){ tick(0, 1400, .13, .12, 'bandpass', 2600); tick(.12, 1800, .035, .35) }, // kayma + masaya vuruş
  flip(){ tick(0, 2800, .02, .22); tick(.05, 2200, .03, .28) },             // kart çevirme
  riffle(n, base = 2200){ for (let i = 0; i < n; i++) tick(i*.018, base + Math.random()*900 + i*40, .022, .22) }, // deste karıştırma
  fail(){ tick(0, 1600, .35, .14, 'lowpass', 300) },
};

function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
function shuffle(a, R){ for(let i=a.length-1;i>0;i--){ const j=R()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]] } return a }

// Türleri seç: r tür, en az r-s farklı dünya (en fazla 5).
function pickTypes(r, s, R){
  const nW = Math.min(5, Math.max(Math.ceil(r/3), r - s));
  const worlds = shuffle([0,1,2,3,4], R).slice(0, nW);
  const pools = worlds.map(w => shuffle(ITEMS.map((it,i)=>i).filter(i => ITEMS[i].w === w), R));
  const out = [];
  for (let i = 0; out.length < r; i++) out.push(pools[i % nW].shift());
  return out;
}

// Açgözlü tahmini çözüm hamlesi: her sıraya en çok olan türü topla.
// Deste kilitlenmesin: her patlamadan sonra görünen sıralarda tamamı olan bir tür kalmalı.
function dealable(rows, c, vis){
  const done = new Set();
  for (let k = 0; k < rows.length; k++){
    const cnt = {};
    rows.slice(0, k + vis).flat().forEach(t => cnt[t] = (cnt[t]||0) + 1);
    const ok = Object.keys(cnt).map(Number).filter(t => cnt[t] === c && !done.has(t));
    if (!ok.length) return false;
    done.add(ok[0]);
  }
  return true;
}
function estimate(rows, c, vis = 99){
  rows = rows.map(r => r.slice());
  let total = 0;
  for (let i = 0; i < rows.length; i++){
    const win = rows.slice(i, i + vis).flat(), all = {};
    win.forEach(t => all[t] = (all[t]||0) + 1);
    const cnt = {}; rows[i].forEach(t => cnt[t] = (cnt[t]||0) + 1);
    const cands = Object.keys(all).map(Number).filter(t => all[t] === c);
    const t = cands.sort((a,b) => (cnt[b]||0) - (cnt[a]||0))[0];
    for (let x = 0; x < c; x++){
      if (rows[i][x] === t) continue;
      total++;
      outer: for (let j = i+1; j < Math.min(rows.length, i + vis); j++) for (let y = 0; y < c; y++)
        if (rows[j][y] === t){ [rows[i][x], rows[j][y]] = [rows[j][y], rows[i][x]]; break outer }
    }
  }
  return total;
}

function startLevel(i, attempt = 0){
  i = Math.min(i, LEVELS.length-1);
  const L = LEVELS[i];
  const R = rng(1000 + i*7919 + attempt*104729);
  const types = pickTypes(L.r, L.s, R);
  let deck, rows;
  do {
    deck = shuffle(types.flatMap(t => Array(L.c).fill(t)), R);
    rows = []; for (let y=0; y<L.r; y++) rows.push(deck.slice(y*L.c, y*L.c+L.c));
  } while (rows[0].every(t => t === rows[0][0]) || !dealable(rows, L.c, L.v || 99));
  const budget = estimate(rows, L.c, L.v || 99) + L.slack;
  board.innerHTML = '';
  const grid = rows.map(row => row.map(makeCard));
  S = {level:i, attempt, L, vis:L.v || 99, cols:L.c, rows0:L.r, grid, moves:budget, budget, used:0, sel:null, busy:false, continued:false};
  S.trayA = tray('active', 'EŞLEŞTİR'); S.trayN = tray('next', 'SIRADAKİ');
  S.deck = document.createElement('div'); S.deck.className = 'deck'; board.appendChild(S.deck);
  grid.flat().forEach(cd => board.appendChild(cd.el));
  store.set('level', i);
  $('winOverlay').hidden = $('failOverlay').hidden = true;
  measure(); layout(false); hud();
  const tips = [
    'İki karta dokun, yerleri değişsin. Üst sırayı aynı kartlarla doldur.',
    'Kapalı kartın arkası hangi dünyadan geldiğini söyler. Sıradaki sırayı da hazırla: zincir hamle kazandırır!',
  ];
  const tag = $('tag');
  tag.hidden = !L.d; tag.className = 'tag ' + (L.d === 2 ? 'super' : 'hard'); tag.textContent = L.d === 2 ? 'ÇOK ZOR' : 'ZOR';
  $('sub').textContent = (i === 15 || i === 16) ? 'Yeni: Deste! Alttaki desteye dokunulamaz. Her patlayan sıradan sonra desteden yeni bir sıra gelir.' : tips[i] || (L.d ? 'Zor seviye! Hamlelerini dikkatli harca.' : 'Zincir kur: art arda patlayan her sıra hamle geri verir.');
}

function tray(kind, label){
  const t = document.createElement('div');
  t.className = 'tray ' + kind;
  t.innerHTML = `<span class="tray-label">${label}</span>`;
  board.appendChild(t);
  return t;
}

function makeCard(type){
  const it = ITEMS[type], w = WORLDS[it.w];
  const el = document.createElement('div');
  el.className = 'card';
  el.tabIndex = 0;
  el.setAttribute('role','button');
  el.innerHTML = `<div class="lift"><div class="inner">
      <div class="face back w-${w.k}"><span class="wname">${w.name}</span></div>
      <div class="face front" style="--wc:${w.c}; --wl:${w.l}"><div class="halo">${sprite(type)}</div></div>
    </div></div>`;
  const card = {id:nextId++, type, el, seen:false};
  el.addEventListener('click', () => tap(card));
  el.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' '){ e.preventDefault(); tap(card) } });
  return card;
}

function measure(){
  const {cols, rows0} = S;
  const shown = Math.min(rows0, S.vis), hasDeck = rows0 > S.vis;
  const box = main.getBoundingClientRect();
  const byW = (box.width - 24 - GAP*(cols-1)) / cols;
  const byH = ((box.height - 44 - (hasDeck ? 30 : 0) - GAP*(shown-1)) / (shown + (hasDeck ? .45 : 0))) / 1.28;
  cw = Math.max(36, Math.min(byW, byH, 104));
  ch = cw * 1.28;
  board.style.setProperty('--cw', cw+'px');
  board.style.setProperty('--ch', ch+'px');
  board.style.width = (cols*cw + GAP*(cols-1)) + 'px';
  S.deckY = shown*(ch+GAP) + 8;
  board.style.height = (shown*ch + GAP*(shown-1) + (hasDeck ? ch*.45*1.28 + 30 : 0)) + 'px';
  S.deck.style.top = S.deckY + 'px'; S.deck.style.height = (ch*.5) + 'px';
  S.trayA.style.height = (ch + 20) + 'px';
  S.trayN.style.top = (ch + GAP - 5) + 'px';
  S.trayN.style.height = (ch + 10) + 'px';
}

function pos(r, c){ return [c*(cw+GAP), r*(ch+GAP)] }

function layout(animate = true){
  if (!animate) board.classList.add('noanim');
  S.grid.forEach((row, r) => row.forEach((cd, c) => {
    const inDeck = r >= S.vis;
    const [x, y] = inDeck ? [board.clientWidth/2 - cw/2, S.deckY] : pos(r, c);
    cd.el.style.transform = `translate(${x}px, ${y}px)` + (inDeck ? ' scale(.6)' : '');
    cd.el.classList.toggle('indeck', inDeck);
    if (r <= 1 && !cd.seen){
      cd.seen = true;
      if (animate){ sfx.flip(); cd.el.querySelector('.sprite').classList.add('pop-in'); cd.el.classList.add('reveal'); setTimeout(() => cd.el.classList.remove('reveal'), 520) }
    }
    cd.el.classList.toggle('open', cd.seen);
    const it = ITEMS[cd.type];
    cd.el.setAttribute('aria-label', cd.seen ? 'Açık kart ' + it.e : 'Kapalı kart, ' + WORLDS[it.w].name);
    cd.r = r; cd.c = c;
  }));
  S.trayA.hidden = S.grid.length === 0;
  S.trayN.hidden = S.grid.length < 2;
  const left = Math.max(0, S.grid.length - S.vis);
  S.deck.hidden = !left;
  S.deck.innerHTML = Array.from({length: Math.min(left, 3)}, (_, k) => `<i style="--k:${k}"></i>`).join('') + `<b>DESTE +${left} sıra</b>`;
  if (!animate){ board.offsetHeight; board.classList.remove('noanim') }
}

function hud(){
  $('lvl').textContent = 'LV.' + (S.level + 1);
  $('moves').textContent = S.moves;
  $('movesPill').classList.toggle('low', S.moves <= 3 && S.grid.length > 0);
  $('coins').textContent = coins;
  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
}
function bump(id){ const p = $(id); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump') }

function select(card){
  if (S.sel) S.sel.el.classList.remove('sel');
  S.sel = card;
  if (card) card.el.classList.add('sel');
}

async function tap(card){
  if (S.busy || S.moves <= 0 || card.r >= S.vis) return;
  if (!S.sel){ select(card); sfx.pick(); return }
  if (S.sel === card){ select(null); return }
  const a = S.sel; select(null);
  swap(a, card);
  S.moves--; S.used++;
  S.busy = true; hud();
  sfx.swap(); buzz(8);
  a.el.style.zIndex = card.el.style.zIndex = 5;
  layout();
  await wait(T + 30);
  a.el.style.zIndex = card.el.style.zIndex = '';
  await resolve();
  hud();
  if (!S.grid.length) await win();
  else if (S.moves <= 0) fail();
  S.busy = false;
}

function swap(a, b){
  const ar = a.r, ac = a.c, br = b.r, bc = b.c;
  S.grid[ar][ac] = b; S.grid[br][bc] = a;
}

async function resolve(){
  let combo = 0;
  while (S.grid.length && S.grid[0].every(cd => cd.type === S.grid[0][0].type)){
    combo++;
    await mergeTopRow(combo);
  }
}

async function mergeTopRow(combo){
  const row = S.grid[0];
  row.forEach(cd => cd.el.classList.add('pop'));
  await wait(reduced ? 60 : 200);
  const cx = (board.clientWidth - cw) / 2;
  row.forEach((cd, i) => {
    cd.el.style.zIndex = 6;
    cd.el.style.transform = `translate(${cx + (i - (row.length-1)/2) * 4}px, 0px)`;
  });
  await wait(T);
  const it = ITEMS[row[0].type];
  burst(board.clientWidth/2, ch/2, WORLDS[it.w].c, 20 + combo*10);
  sfx.riffle(6 + combo*4, 2000 + combo*300);
  buzz(combo > 1 ? [30, 40, 30 + combo*15] : 25);
  if (combo > 1 && !reduced){ board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake') }
  floatText(combo > 1 ? `Zincir x${combo}!` : 'Harika!', board.clientWidth/2, ch/2);
  if (combo > 1){                                          // zincir iadesi: 2. sıra +1, 3. sıra +2...
    const gain = combo - 1;
    S.moves += gain;
    setTimeout(() => floatText(`+${gain} hamle`, board.clientWidth/2, ch/2 + 34, 'gain'), 180);
    bump('movesPill');
  }
  row.forEach(cd => cd.el.classList.add('gone'));
  await wait(reduced ? 80 : 260);
  row.forEach(cd => cd.el.remove());
  S.grid.shift();
  layout(); hud();
  await wait(T + 40);
}

function burst(x, y, tint, n = 26){
  if (reduced) return;
  const colors = [tint, '#e7b75a', '#fbf3e2', '#7ee0a1'];
  for (let i=0; i<n; i++){
    const s = document.createElement('div');
    s.className = 'spark';
    const ang = Math.random()*Math.PI*2, d = 50 + Math.random()*120;
    s.style.left = x+'px'; s.style.top = y+'px';
    s.style.background = colors[i % colors.length];
    s.style.setProperty('--dx', Math.cos(ang)*d+'px');
    s.style.setProperty('--dy', Math.sin(ang)*d+'px');
    board.appendChild(s);
    setTimeout(() => s.remove(), 750);
  }
}
function floatText(txt, x, y, cls = ''){
  const f = document.createElement('div');
  f.className = 'float ' + cls; f.textContent = txt;
  f.style.left = x+'px'; f.style.top = y+'px';
  board.appendChild(f);
  setTimeout(() => f.remove(), 1050);
}

// Kazanma: kalan hamleler en fazla ~1 saniyede, birkaç patlamayla coin'e dönüşür.
async function win(){
  const left = S.moves;
  const bonus = left * 5;
  let earned = 20 + bonus;
  if (left){
    $('sub').textContent = 'Kalan hamleler coin\'e dönüşüyor!';
    const pops = Math.min(left, 5), per = Math.ceil(left / pops);
    for (let k = 0; k < pops; k++){
      S.moves = Math.max(0, S.moves - per); hud();
      const x = (k + .5) / pops * board.clientWidth, y = ch * (.6 + (k % 2) * .5);
      burst(x, y, '#e7b75a', 14);
      if (k === pops - 1) floatText(`+${bonus} 🪙`, board.clientWidth/2, ch);
      sfx.riffle(4, 2600 + k*200); buzz(6);
      await wait(reduced ? 40 : 160);
    }
    coins += bonus;
  } else $('sub').textContent = '';
  coins += 20; store.set('coins', coins); hud();
  const ratio = left / S.budget;
  const stars = S.continued ? 1 : ratio >= .3 ? 3 : ratio >= .1 ? 2 : 1;
  $('stars').innerHTML = [1,2,3].map(n => `<span class="${n<=stars?'':'off'}">⭐</span>`).join('');
  const last = S.level >= LEVELS.length - 1;
  $('winTitle').textContent = last ? 'Hepsi bitti!' : 'Seviye tamam!';
  $('winCoins').textContent = `+${earned} 🪙`;
  $('winText').textContent = `${S.used} hamle kullandın, ${left} hamle arttı.`;
  $('nextBtn').textContent = last ? 'Baştan başla' : 'Sonraki seviye';
  await wait(250);
  $('winOverlay').hidden = false; $('nextBtn').focus();
}

function fail(){
  const n = S.grid.length;
  buzz([40, 60, 40]); sfx.fail();
  $('failText').textContent = n === 1 ? 'Sadece 1 sıra kalmıştı!' : `${n} sıra kaldı`;
  $('failSub').textContent = S.continued ? 'Bu seviyede devam hakkını kullandın.' : 'Prototip: devam ücretsiz, seviye başına 1 kez.';
  $('contBtn').hidden = S.continued;
  $('failOverlay').hidden = false;
  (S.continued ? $('retryBtn') : $('contBtn')).focus();
}

$('contBtn').onclick = () => {
  S.continued = true; S.moves += 5; S.busy = false;
  $('failOverlay').hidden = true; hud(); bump('movesPill');
};
$('retryBtn').onclick = () => startLevel(S.level, S.attempt + 1);
$('nextBtn').onclick = () => startLevel(S.level >= LEVELS.length-1 ? 0 : S.level + 1);
$('restartBtn').onclick = () => { if (!S.busy) startLevel(S.level, S.attempt + 1) };
$('soundBtn').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); hud() };
addEventListener('resize', () => { if (S){ measure(); layout(false) } });

startLevel(store.get('level', 0));
</script>
